name: Vercel Prebuilt Deployment Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_TELEMETRY_DISABLED: '1'

jobs:
  deploy-preview:
    name: Deploy Preview (Pull Request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      preview_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Vercel CLI credentials
        id: creds
        run: |
          if [ -n "${VERCEL_TOKEN}" ] && [ -n "${VERCEL_ORG_ID}" ] && [ -n "${VERCEL_PROJECT_ID}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Vercel GitHub Integration Mode"
              echo "`VERCEL_TOKEN` secret is not configured in GitHub Actions; skipping CLI `--prebuilt` upload because the native **Vercel GitHub App** builds and deploys this PR automatically."
              echo ""
              echo "To enable CI-built `--prebuilt` deployments instead, add `VERCEL_TOKEN` under **Settings -> Secrets and variables -> Actions**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js LTS
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install project dependencies
        if: steps.creds.outputs.enabled == 'true'
        run: npm ci

      - name: Run pre-deploy quality gates
        if: steps.creds.outputs.enabled == 'true'
        run: |
          npx tsc --noEmit
          npm run lint
          npm test

      - name: Install Vercel CLI
        if: steps.creds.outputs.enabled == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Preview environment configuration
        if: steps.creds.outputs.enabled == 'true'
        run: vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"

      - name: Build prebuilt Preview artifact
        if: steps.creds.outputs.enabled == 'true'
        run: vercel build --token="${VERCEL_TOKEN}"

      - name: Deploy prebuilt artifact to Vercel Preview
        id: deploy
        if: steps.creds.outputs.enabled == 'true'
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token="${VERCEL_TOKEN}")
          echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "Deployed Preview URL: ${DEPLOY_URL}"

      - name: Post-deploy HTTP smoke test (/api/health)
        if: steps.creds.outputs.enabled == 'true'
        env:
          TARGET_URL: ${{ steps.deploy.outputs.url }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "${BYPASS_SECRET}" ]; then
            EXTRA_ARGS+=(-H "x-vercel-protection-bypass: ${BYPASS_SECRET}")
          fi

          for attempt in 1 2 3 4 5; do
            RESPONSE=$(curl -fsSL "${EXTRA_ARGS[@]}" "${TARGET_URL}/api/health" || true)
            if echo "${RESPONSE}" | grep -q '"status":"ok"'; then
              echo "Preview health check passed on attempt ${attempt}: ${RESPONSE}"
              exit 0
            fi
            echo "Attempt ${attempt} waiting for deployment readiness..."
            sleep 3
          done

          echo "Smoke test failed against ${TARGET_URL}/api/health"
          exit 1

  deploy-production:
    name: Deploy Production (main)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Vercel CLI credentials
        id: creds
        run: |
          if [ -n "${VERCEL_TOKEN}" ] && [ -n "${VERCEL_ORG_ID}" ] && [ -n "${VERCEL_PROJECT_ID}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Vercel GitHub Integration Mode (Active)"
              echo "Project is deployed automatically via the **Vercel GitHub App** to https://edgepulse-deploy.vercel.app."
              echo "- `VERCEL_ORG_ID` and `VERCEL_PROJECT_ID` are pre-configured; add `VERCEL_TOKEN` in repository secrets anytime to switch to CLI `--prebuilt` deployments."
              echo "- Running live post-deploy HTTP smoke verification against `https://edgepulse-deploy.vercel.app/api/health`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js LTS
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install project dependencies
        if: steps.creds.outputs.enabled == 'true'
        run: npm ci

      - name: Run pre-deploy quality gates
        if: steps.creds.outputs.enabled == 'true'
        run: |
          npx tsc --noEmit
          npm run lint
          npm test

      - name: Install Vercel CLI
        if: steps.creds.outputs.enabled == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Production environment configuration
        if: steps.creds.outputs.enabled == 'true'
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build prebuilt Production artifact
        if: steps.creds.outputs.enabled == 'true'
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy prebuilt artifact to Vercel Production
        id: deploy
        if: steps.creds.outputs.enabled == 'true'
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}")
          echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "Deployed Production URL: ${DEPLOY_URL}"

      - name: Post-deploy HTTP smoke test (/api/health)
        env:
          TARGET_URL: ${{ steps.deploy.outputs.url || 'https://edgepulse-deploy.vercel.app' }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "${BYPASS_SECRET}" ]; then
            EXTRA_ARGS+=(-H "x-vercel-protection-bypass: ${BYPASS_SECRET}")
          fi

          for attempt in 1 2 3 4 5; do
            RESPONSE=$(curl -fsSL "${EXTRA_ARGS[@]}" "${TARGET_URL}/api/health" || true)
            if echo "${RESPONSE}" | grep -q '"status":"ok"'; then
              echo "Production health check passed on attempt ${attempt}: ${RESPONSE}"
              exit 0
            fi
            echo "Attempt ${attempt} waiting for production edge propagation..."
            sleep 4
          done

          echo "Production smoke test failed against ${TARGET_URL}/api/health"
          exit 1
